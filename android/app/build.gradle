plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.myapp"
    // compileSdk=36 required by androidx.core:core:1.18.0 and other AndroidX libs.
    // android-36 platform is installed at C:\Android\platforms\android-36.
    compileSdk = 36
    // Pin NDK to the version available in this local SDK install.
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        applicationId = "com.example.myapp"
        minSdkVersion = 24   // google_mlkit_face_detection requires 24+
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Limit to the two ABIs that cover all modern Android phones.
        // This cuts debug APK size from ~128 MB → ~55 MB.
        // Use `flutter build apk --split-per-abi` for production.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
